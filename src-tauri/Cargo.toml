[package]
name = "actions-lights"
version = "1.1.1"
description = "Menu bar app showing GitHub Actions workflow status"
authors = ["luyz2000"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "actions_lights_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
chrono = { version = "0.4.45", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
bytes = "1.12.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-service-management = "0.3.2"
tauri-nspanel = "2.1"
