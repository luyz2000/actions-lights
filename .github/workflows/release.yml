name: Release

# On every push to main, release-please keeps a "chore(main): release X.Y.Z" PR up to date
# (version bump in all manifests + CHANGELOG from conventional commits). Merging that PR
# creates the tag and the GitHub release; the build jobs then attach the macOS and Linux apps.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    name: macOS (universal)
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: macos-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      # Signs the updater bundle and uploads it with latest.json to the release.
      - name: Build universal
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ needs.release-please.outputs.tag }}
          releaseDraft: false
          includeUpdaterJson: true

      - name: Adjuntar el .dmg al release
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          out="Actions-Lights_${VERSION}_universal.dmg"
          cp "$dmg" "$out"
          gh release upload "$TAG" "$out" --clobber
          # tauri-action also uploaded it with the space turned into a dot; keep one copy.
          gh release delete-asset "$TAG" "Actions.Lights_${VERSION}_universal.dmg" -y || true

      - name: Añadir instrucciones de instalación a las notas
        run: |
          gh release view "$TAG" --json body -q .body > notes.md
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-install.md >> notes.md
          gh release edit "$TAG" --title "Actions Lights $TAG" --notes-file notes.md

  # Runs after macOS: tauri-action merges latest.json by downloading, editing and
  # re-uploading it, so two jobs writing it at once would drop one's platforms.
  linux:
    name: Linux (x86_64)
    needs: [release-please, macos]
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      # Uploads the .deb and .AppImage with their signatures and adds the linux-x86_64
      # entries to the latest.json the macOS job left on the release.
      - name: Build deb y AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ needs.release-please.outputs.tag }}
          releaseDraft: false
          includeUpdaterJson: true

  # After Linux, for the same reason: one latest.json writer at a time.
  windows:
    name: Windows (x86_64)
    needs: [release-please, linux]
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      # Unsigned (no code-signing certificate): SmartScreen warns on first run. Uploads the
      # NSIS installer with its signature and adds windows-x86_64 to latest.json.
      - name: Build NSIS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ needs.release-please.outputs.tag }}
          releaseDraft: false
          includeUpdaterJson: true
