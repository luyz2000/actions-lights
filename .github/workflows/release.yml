name: Release

# On every push to main, release-please keeps a "chore(main): release X.Y.Z" PR up to date
# (version bump in all manifests + CHANGELOG from conventional commits). Merging that PR
# creates the tag and the GitHub release; the build job then attaches the macOS app.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    name: macOS (universal)
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: macos-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      # Signs the updater bundle and uploads it with latest.json to the release.
      - name: Build universal
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ needs.release-please.outputs.tag }}
          releaseDraft: false
          includeUpdaterJson: true

      - name: Adjuntar el .dmg al release
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          out="Actions-Lights_${VERSION}_universal.dmg"
          cp "$dmg" "$out"
          gh release upload "$TAG" "$out" --clobber
          # tauri-action also uploaded it with the space turned into a dot; keep one copy.
          gh release delete-asset "$TAG" "Actions.Lights_${VERSION}_universal.dmg" -y || true

      - name: Añadir instrucciones de instalación a las notas
        run: |
          gh release view "$TAG" --json body -q .body > notes.md
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-install.md >> notes.md
          gh release edit "$TAG" --title "Actions Lights $TAG" --notes-file notes.md
